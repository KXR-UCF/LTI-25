services:
  questdb:
    image: questdb/questdb:latest
    container_name: osiris
    ports:
      - '9000:9000'
      - '9009:9009'
      - '8812:8812'
      - '9003:9003'
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  grafana:
    image: grafana/grafana-oss:latest
    container_name: lti-grafana-1
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?error_message}
    volumes:
      - lti-grafana-data:/var/lib/grafana

volumes:
  lti-grafana-data: